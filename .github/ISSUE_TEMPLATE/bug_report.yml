name: Bug report
description: Report a problem parsing an .egp file or unexpected output.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please do **not** attach real `.egp` files or
        output that may contain confidential data — a minimal synthetic
        reproduction is ideal.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal code snippet or CLI command.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: pyegp-parser version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback / logs
      render: shell
